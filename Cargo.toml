[workspace]
resolver = "2"
members = ["crates/*", "bin/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/synapse-network/synapse"
description = "Synapse: a decentralized P2P LLM inference network"

[workspace.dependencies]
synapse-core = { path = "crates/core" }
synapse-ffi = { path = "crates/ffi" }
synapse-net = { path = "crates/net" }
synapse-engine = { path = "crates/engine" }

tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
flume = "0.11"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.8", features = ["v4"] }
llama-cpp-2 = { version = "0.1", default-features = false }
